name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check closedesk tests
      - name: Unit tests
        run: uv run pytest
        env:
          LLM_PROVIDER: none
