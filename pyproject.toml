[project]
name = "closedesk"
version = "0.1.0"
description = "Governed UPI reconciliation on Exasol Personal for ExaThon India 2026"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sharma S S", email = "2000sharma.ss@gmail.com" }]
dependencies = [
  "pyexasol>=0.26.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["closedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
